# Supabase CLI config for local development.
# Run `supabase start` then `supabase db reset` to apply migrations + seed.
project_id = "trunk-ai-receptionist"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing (invite / confirmation emails land here).
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# For local dev, don't require email confirmation so the invite flow is testable
# end-to-end without opening Inbucket. Enable confirmations in production.
enable_confirmations = false
